<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--bd:#1E2A40;--fg:#E8ECF4;--sub:#B4BDCE;--mut:#8C97AD;--acc:#F5A524;--teal:#3FB8AF}
html.light{--bg:#F6F8FC;--bd:#D5DCE8;--fg:#0B1220;--sub:#3A465C;--mut:#5C6880;--acc:#C77F00;--teal:#1F8A82}
html,body{margin:0;width:800px;background:transparent}
.b{box-sizing:border-box;width:800px;height:200px;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:26px 36px;display:flex;flex-direction:column;color:var(--fg)}
.r{display:flex;justify-content:space-between;font:400 12px 'JetBrains Mono',monospace}
.r span:first-child{color:var(--acc)} .r span:last-child{color:var(--mut)}
h1{margin:24px 0 0;font:600 47px/1 'Space Grotesk',sans-serif;letter-spacing:-.01em}
p{margin:10px 0 0;font:400 18px/1.2 'Space Grotesk',sans-serif;color:var(--sub)}
.bars{display:flex;gap:10px;margin-top:auto;margin-bottom:0}.bars i{display:block;height:4px;border-radius:2px}
</style></head><body><div class="b" id="root">
<div class="r"><span>$ whoami</span><span>Enterprise AI Product Builder</span></div>
<h1>Gaurav Pandvia</h1>
<p>Product Manager · Enterprise AI &amp; Hybrid Cloud · Engineer turned PM who still builds</p>
<div class="bars"><i style="width:64px;background:var(--acc)"></i><i style="width:32px;background:var(--teal)"></i></div>
</div><script>if(location.hash=='#light')document.documentElement.className='light'</script></body></html>
